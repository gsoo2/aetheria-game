<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>도트 제국</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 화면 전체 캔버스 위에 도트 창(DOM)이 겹치는 구조. 단일 밤 테마. */
@font-face { font-family: "Galmuri11"; src: url("fonts/Galmuri11.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Galmuri11"; font-weight: 700; src: url("fonts/Galmuri11-Bold.woff2") format("woff2"); font-display: swap; }
:root {
  --night: #120f24; --panel: #221c3e; --panel-2: #2d2551; --panel-3: #3a3166;
  --ink: #f4ecd6; --muted: #a99fcb; --gold: #f2c14e; --gold-d: #a8771c; --line: #09071a;
  --red: #e0533f; --green: #56c46e; --blue: #5b8def;
  --font: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--font); font-size: 12px; overflow: hidden; -webkit-font-smoothing: none; user-select: none; -webkit-user-select: none; touch-action: none; }
#game { position: fixed; inset: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
button { font-family: var(--font); font-size: 12px; color: var(--ink); cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* 도트 창 */
.win { background: var(--panel); border: 3px solid var(--line); box-shadow: inset 0 0 0 2px var(--gold-d), inset 0 0 0 4px var(--line), 4px 4px 0 rgba(0,0,0,.45); padding: 14px 16px; }
.btn { background: var(--panel-3); border: 2px solid var(--line); box-shadow: inset -2px -2px 0 rgba(0,0,0,.35), inset 2px 2px 0 rgba(255,255,255,.12); padding: 7px 12px; line-height: 1.2; white-space: nowrap; }
.btn:hover { background: #4a3f80; }
.btn:active { box-shadow: inset 2px 2px 0 rgba(0,0,0,.35); transform: translateY(1px); }
.btn.gold { background: var(--gold); color: #2a1a05; }
.btn.gold:hover { background: #ffd56b; }
.btn.red { background: #b8382a; }
.btn.red:hover { background: #d4493a; }
.btn.green { background: #2f8f4a; }
.btn.green:hover { background: #3aa85a; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn.small { padding: 4px 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 8px; }
.muted { color: var(--muted); }
.gold-t { color: var(--gold); }
.red-t { color: var(--red); }
.green-t { color: var(--green); }
h1, h2, h3 { font-weight: 700; margin: 0; text-wrap: balance; }
h2 { font-size: 16px; }
h3 { font-size: 12px; letter-spacing: .04em; color: var(--gold); }
.num { font-variant-numeric: tabular-nums; }
canvas.px { image-rendering: pixelated; }
[hidden] { display: none !important; }

/* 타이틀 */
#title { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left)); }
#title .logo { text-align: center; }
#title .logo .sub { font-size: 12px; color: var(--gold); letter-spacing: .3em; }
#title .logo h1 { font-size: 44px; line-height: 1.1; color: var(--ink); text-shadow: 4px 4px 0 var(--line), -2px -2px 0 #6a4bc4; margin: 6px 0 4px; }
#title .logo .tag { color: var(--muted); }
#title .menu { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; align-items: center; }
#title .menu .btn { min-width: 200px; font-size: 14px; padding: 10px 16px; }
#title .credit { position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; color: var(--muted); font-size: 11px; padding: 0 16px; }
.blink { animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

/* 대화창 */
#dialog { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); width: min(760px, calc(100% - 24px)); display: flex; gap: 14px; align-items: flex-start; z-index: 30; }
#dialog canvas { width: 96px; height: 96px; flex: none; border: 3px solid var(--line); background: var(--panel-2); }
#dialog .body { flex: 1; min-width: 0; }
#dialog .name { color: var(--gold); font-weight: 700; margin-bottom: 6px; font-size: 13px; }
#dialog .text { font-size: 14px; line-height: 1.6; min-height: 46px; white-space: pre-wrap; }
#dialog .choices { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; align-items: flex-start; }
#dialog .choices .btn { text-align: left; }
#dialog .more { position: absolute; right: 16px; bottom: 8px; color: var(--gold); }

/* 성 HUD */
#castleHud { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 10; }
#castleHud > * { pointer-events: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 2px solid var(--line); box-shadow: inset 0 0 0 1px var(--gold-d); padding: 5px 9px; }
.chip canvas { width: 18px; height: 18px; }
#hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); background: rgba(9,7,26,.75); padding: 6px 12px; border: 2px solid var(--line); color: var(--ink); z-index: 9; white-space: nowrap; }

/* 모달 */
.modal-bg { position: absolute; inset: 0; background: rgba(6,4,16,.6); display: grid; place-items: center; z-index: 40; padding: 16px max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left)); }
.modal { width: min(640px, 100%); max-height: calc(100% - 20px); overflow: auto; }
.modal .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
.grid-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.item { display: flex; gap: 10px; align-items: flex-start; background: var(--panel-2); border: 2px solid var(--line); padding: 8px; }
.item canvas { width: 36px; height: 36px; flex: none; background: var(--panel-3); border: 2px solid var(--line); }
.item .info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.item .nm { font-weight: 700; }
.item .ds { color: var(--muted); font-size: 11px; line-height: 1.4; }
.item.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tabs .btn.on { background: var(--gold); color: #2a1a05; }

/* 군주 선택 */
#select { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); gap: 10px; background: rgba(12,9,28,.82); }
#select .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
#select .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 1fr); gap: 12px; }
#select .left { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
#selMapWrap { position: relative; border: 3px solid var(--line); background: #10204a; }
#selMap { width: 100%; display: block; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; overflow: auto; min-height: 0; flex: 1; align-content: start; padding: 2px; }
.card { background: var(--panel-2); border: 2px solid var(--line); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; position: relative; }
.card canvas { width: 64px; height: 64px; }
.card .nm { font-size: 11px; line-height: 1.25; }
.card.on { border-color: var(--gold); background: #463a7a; }
.card.locked canvas { filter: grayscale(1) brightness(.5); }
.card .lock { position: absolute; top: 4px; right: 4px; background: var(--line); color: var(--gold); font-size: 10px; padding: 1px 4px; }
#detail { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; }
#detail .who { display: flex; gap: 12px; align-items: flex-start; }
#detail .who canvas { width: 112px; height: 112px; border: 3px solid var(--line); flex: none; }
#detail .quote { font-size: 13px; line-height: 1.6; color: var(--ink); border-left: 3px solid var(--gold-d); padding-left: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg .btn.on { background: var(--gold); color: #2a1a05; }
.opt { display: grid; grid-template-columns: 70px 1fr; gap: 6px 10px; align-items: center; }
.picker { display: flex; align-items: center; gap: 6px; }
.picker .val { min-width: 76px; text-align: center; }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; }
.sw { width: 22px; height: 22px; border: 2px solid var(--line); padding: 0; }
.sw.on { outline: 2px solid var(--gold); outline-offset: 1px; }
input[type=text] { font-family: var(--font); font-size: 13px; background: var(--line); color: var(--ink); border: 2px solid var(--panel-3); padding: 6px 8px; width: 100%; box-sizing: border-box; user-select: text; -webkit-user-select: text; }
input[type=range] { width: 100%; accent-color: var(--gold); }

/* 지도 HUD */
#mapHud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#mapHud > * { pointer-events: auto; }
#topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left)); background: linear-gradient(var(--panel), rgba(34,28,62,.92)); border-bottom: 3px solid var(--line); flex-wrap: wrap; }
#topbar .me { display: flex; align-items: center; gap: 8px; min-width: 0; }
#topbar .me canvas { width: 36px; height: 36px; border: 2px solid var(--line); }
#topbar .me .nm { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
#topbar .stats { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
#topbar .stat { display: inline-flex; gap: 5px; align-items: center; background: var(--line); padding: 4px 8px; }
#topbar .stat canvas { width: 18px; height: 18px; }
.bar { width: 90px; height: 8px; background: #0b0918; border: 1px solid #3a3166; position: relative; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); }
.bar b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--red); }
#ppanel { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 70px; width: 290px; max-height: calc(100% - 150px); overflow: auto; }
#ppanel .ttl { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
#ppanel .flag { width: 14px; height: 14px; border: 2px solid var(--line); flex: none; }
#ppanel .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 6px 0 10px; }
#ppanel .kv span:nth-child(odd) { color: var(--muted); }
#ppanel .sec { border-top: 2px solid var(--line); padding-top: 8px; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
#bottombar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; padding: 8px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); pointer-events: none; }
#bottombar > * { pointer-events: auto; }
#bag { display: flex; gap: 4px; flex-wrap: wrap; max-width: 60%; }
.slot { width: 44px; height: 44px; background: var(--panel); border: 2px solid var(--line); box-shadow: inset 0 0 0 1px var(--gold-d); position: relative; padding: 0; display: grid; place-items: center; }
.slot canvas { width: 30px; height: 30px; }
.slot .cnt { position: absolute; right: 2px; bottom: 1px; font-size: 10px; color: var(--gold); text-shadow: 1px 1px 0 #000; }
.slot.on { background: var(--gold-d); }
#endTurn { font-size: 15px; padding: 12px 20px; }
#log { position: absolute; left: max(10px, env(safe-area-inset-left)); top: 70px; width: 270px; display: flex; flex-direction: column; gap: 3px; pointer-events: none; }
#log div { background: rgba(9,7,26,.72); padding: 4px 8px; border-left: 3px solid var(--muted); font-size: 11px; line-height: 1.4; animation: logIn .25s steps(3); }
#log div.war { border-color: var(--red); }
#log div.good { border-color: var(--green); }
#log div.gold { border-color: var(--gold); }
@keyframes logIn { from { transform: translateX(-12px); opacity: 0; } }
#setupBar { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); text-align: center; z-index: 12; }
#setupBar .swatches { justify-content: center; margin: 8px 0; }
#setupBar .sw { width: 28px; height: 28px; }
#targetHint { position: absolute; left: 50%; top: 74px; transform: translateX(-50%); z-index: 12; white-space: nowrap; }
#toast { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 60; font-size: 22px; font-weight: 700; color: var(--ink); text-shadow: 3px 3px 0 var(--line), -1px -1px 0 var(--line); pointer-events: none; text-align: center; white-space: nowrap; }
#fade { position: absolute; inset: 0; pointer-events: none; z-index: 80; }
#tooltip { position: absolute; z-index: 15; pointer-events: none; background: rgba(9,7,26,.88); border: 2px solid var(--line); padding: 4px 8px; white-space: nowrap; font-size: 11px; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }

@media (max-width: 760px) {
  #select .main { grid-template-columns: 1fr; overflow: auto; }
  #select .left { min-height: auto; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); flex: none; overflow: visible; }
  .card canvas { width: 48px; height: 48px; }
  #detail { overflow: visible; }
  #ppanel { left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); width: auto; top: auto; bottom: 74px; max-height: 44%; }
  #log { width: auto; right: max(10px, env(safe-area-inset-right)); top: 58px; }
  #log div:nth-child(n+3) { display: none; }
  #topbar { flex-wrap: nowrap; gap: 6px; }
  #topbar .me canvas { width: 30px; height: 30px; }
  #topbar .me .nm { max-width: 72px; font-size: 12px; }
  #meRuler { display: none; }
  #topbar .stats { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 4px; }
  #topbar .stats::-webkit-scrollbar { display: none; }
  #topbar .stat { padding: 3px 6px; flex: none; }
  #ppanel { max-height: 40%; }
  .bar { width: 56px; }
  #title .logo h1 { font-size: 32px; }
  #dialog canvas { width: 64px; height: 64px; }
  #dialog .text { font-size: 13px; }
  #bag { max-width: 62%; }
  .slot { width: 40px; height: 40px; }
  #endTurn { padding: 10px 14px; }
}
@media (prefers-reduced-motion: reduce) { .blink, #log div { animation: none; } }
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <!-- 타이틀 -->
  <section id="title">
    <div>
      <div class="logo">
        <div class="sub">PIXEL CONQUEST</div>
        <h1>도트 제국</h1>
        <div class="tag">시간의 군주, 세계 지도를 칠하다</div>
      </div>
      <div class="menu">
        <button class="btn gold" id="btnStart">성으로 들어가기</button>
        <button class="btn" id="btnSound">소리: 켜짐</button>
      </div>
    </div>
    <div class="credit">지도 데이터: Natural Earth · 글꼴: 갈무리 (SIL OFL) · 이 게임의 인물은 역사 속 군주를 바탕으로 한 창작 캐릭터입니다</div>
  </section>

  <!-- 성 HUD -->
  <div id="castleHud" hidden>
    <div class="row">
      <span class="chip"><canvas class="px" data-icon="gold" width="36" height="36"></canvas><b class="num" id="hudGold">0</b><span class="muted">왕실 금화</span></span>
      <span class="chip" id="hudRelics"></span>
    </div>
    <div class="row">
      <button class="btn small" id="btnSound2">소리</button>
    </div>
  </div>
  <div id="hint" hidden></div>

  <!-- 대화 -->
  <div id="dialog" class="win" hidden>
    <canvas class="px" id="dlgPortrait" width="128" height="128"></canvas>
    <div class="body">
      <div class="name" id="dlgName"></div>
      <div class="text" id="dlgText"></div>
      <div class="choices" id="dlgChoices"></div>
    </div>
    <div class="more blink" id="dlgMore">▼</div>
  </div>

  <!-- 군주 선택 -->
  <section id="select" hidden>
    <div class="top">
      <div>
        <h2>누구의 운명을 이어받으시겠습니까?</h2>
        <div class="muted">지도 속 군주를 고르거나, 나만의 군주를 새로 만드세요.</div>
      </div>
      <div class="row">
        <span class="chip"><canvas class="px" data-icon="gold" width="36" height="36"></canvas><b class="num" id="selGold">0</b></span>
        <button class="btn" id="selBack">성으로 돌아가기</button>
      </div>
    </div>
    <div class="main">
      <div class="left">
        <div id="selMapWrap"><canvas id="selMap" class="px"></canvas></div>
        <div class="cards" id="cards"></div>
      </div>
      <div class="win" id="detail"></div>
    </div>
  </section>

  <!-- 지도 HUD -->
  <div id="mapHud" hidden>
    <div id="topbar">
      <div class="me"><canvas class="px" id="meFace" width="64" height="64"></canvas><div><div class="nm" id="meName"></div><div class="muted" id="meRuler"></div></div></div>
      <div class="stats">
        <span class="stat" title="국고"><canvas class="px" data-icon="gold" width="36" height="36"></canvas><b class="num" id="stGold"></b><span class="num" id="stInc"></span></span>
        <span class="stat" title="징병 가능 인력"><canvas class="px" data-icon="people" width="36" height="36"></canvas><b class="num" id="stMp"></b></span>
        <span class="stat" title="총 병력"><canvas class="px" data-icon="sword" width="36" height="36"></canvas><b class="num" id="stTroops"></b></span>
        <span class="stat" title="목표까지 영토"><span id="stTurn"></span><span class="bar"><i id="stBar"></i><b id="stGoalMark"></b></span><span class="num" id="stProv"></span></span>
      </div>
      <button class="btn small" id="btnMenu">메뉴</button>
    </div>
    <div id="log"></div>
    <div id="ppanel" class="win" hidden></div>
    <div id="bottombar">
      <div id="bag"></div>
      <div class="row">
        <button class="btn small" id="btnZoomOut" aria-label="축소">－</button>
        <button class="btn small" id="btnZoomIn" aria-label="확대">＋</button>
        <button class="btn small" id="btnHome">수도</button>
        <button class="btn gold" id="endTurn">턴 종료</button>
      </div>
    </div>
    <div id="targetHint" class="chip" hidden></div>
  </div>
  <div id="setupBar" class="win" hidden></div>
  <div id="tooltip" hidden></div>

  <div id="modalRoot"></div>
  <div id="toast" hidden></div>
  <canvas id="fade"></canvas>
</div>

<script src="js/mapdata.js"></script>
<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/worldview.js"></script>
<script src="js/castle.js"></script>
<script src="js/ui.js"></script>
<script src="js/play.js"></script>
<script src="js/main.js"></script>
</body>
</html>
